<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17191f">
  <title>紅單掃描器</title>
  <meta name="description" content="不漏張、不上傳的本機紅單掃描工具">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e84b58'/%3E%3Cpath d='M18 12h22l8 8v32H18z' fill='white'/%3E%3Cpath d='M40 12v10h8M24 31h18M24 39h18M24 47h12' fill='none' stroke='%23e84b58' stroke-width='4'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--bg:#101116;--panel:#1a1c23;--panel2:#232630;--line:#343844;--text:#f6f7fb;--muted:#a9afbd;--accent:#ff5966;--accent2:#ff8790;--ok:#67d69a;--radius:20px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;min-height:100dvh}button,input,select{font:inherit}button{cursor:pointer}
    .app{max-width:720px;margin:auto;padding:16px 16px 120px}.top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 16px}.title{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-weight:900}.title h1{font-size:1.25rem;margin:0}.privacy{font-size:.8rem;color:var(--muted)}
    .viewer{position:relative;background:#08090c;border:1px solid var(--line);border-radius:24px;overflow:hidden;aspect-ratio:3/4;display:grid;place-items:center}.viewer.empty:before{content:"紅單放平、拍完整一點\A拍完會直接加進本機清單";white-space:pre;text-align:center;color:var(--muted);line-height:1.8}.viewer img{width:100%;height:100%;object-fit:contain;display:none}.viewer.has img{display:block}.count{position:absolute;top:12px;left:12px;background:#101116d9;border:1px solid #ffffff22;border-radius:999px;padding:7px 11px;font-size:.85rem}.badge{position:absolute;top:12px;right:12px;background:#101116d9;border:1px solid #ffffff22;border-radius:999px;padding:7px 11px;font-size:.8rem;color:var(--ok)}
    .capture{display:block;margin:18px auto 14px;width:76px;height:76px;border-radius:50%;border:6px solid #fff;background:var(--accent);box-shadow:0 0 0 3px #ffffff22}.capture:active{transform:scale(.94)}#camera{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
    .toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn{border:1px solid var(--line);color:var(--text);background:var(--panel);padding:12px 8px;border-radius:14px;font-weight:650}.btn:disabled{opacity:.38;cursor:not-allowed}.btn.danger{color:#ff9aa1}.btn.primary{background:var(--accent);border-color:var(--accent)}
    .settings{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.seg{display:flex;background:#101116;border-radius:12px;padding:3px}.seg button{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:9px}.seg button.active{background:var(--panel2);color:white}.hint{font-size:.8rem;color:var(--muted);margin:10px 0 0;line-height:1.5}
    .pages-head{display:flex;justify-content:space-between;align-items:end;margin:24px 2px 10px}.pages-head h2{font-size:1rem;margin:0}.pages-head span{color:var(--muted);font-size:.8rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.thumb{position:relative;aspect-ratio:3/4;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{position:absolute;bottom:6px;left:6px;background:#101116d9;border-radius:999px;padding:3px 7px;font-size:.75rem}.thumb button{position:absolute;top:5px;right:5px;width:29px;height:29px;border:0;border-radius:50%;background:#101116d9;color:white}.empty-list{grid-column:1/-1;text-align:center;color:var(--muted);padding:24px 0;font-size:.9rem}
    .export{position:fixed;z-index:10;bottom:0;left:0;right:0;background:linear-gradient(transparent,#101116 18%);padding:22px max(16px,calc((100vw - 720px)/2 + 16px)) max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:10px}.export .btn{padding:15px 10px}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%) translateY(20px);opacity:0;background:#f7f7fa;color:#17191f;padding:10px 14px;border-radius:999px;font-weight:700;font-size:.85rem;transition:.2s;z-index:30;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .busy{position:fixed;inset:0;background:#08090dcc;display:none;place-items:center;z-index:40;text-align:center}.busy.show{display:grid}.spinner{width:42px;height:42px;border:4px solid #ffffff33;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(min-width:600px){.viewer{aspect-ratio:4/3}.grid{grid-template-columns:repeat(5,1fr)}}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div class="title"><div class="logo">單</div><h1>紅單掃描器</h1></div><div class="privacy">只在這台裝置處理</div></header>
  <section id="viewer" class="viewer empty"><img id="preview" alt="最新掃描頁"><div id="counter" class="count">0 張</div><div class="badge">不會自動刪頁</div></section>
  <input id="camera" type="file" accept="image/*" capture="environment" multiple>
  <button id="shoot" class="capture" aria-label="拍攝紅單"></button>
  <div class="toolbar">
    <button id="importBtn" class="btn">從相簿加入</button>
    <button id="undoBtn" class="btn" disabled>復原上一張</button>
    <button id="clearBtn" class="btn danger" disabled>清空這批</button>
  </div>
  <section class="settings">
    <div class="settings-row"><strong>影像效果</strong><div class="seg" role="group" aria-label="影像效果"><button data-mode="color">原色</button><button class="active" data-mode="scan">掃描</button><button data-mode="bw">黑白</button></div></div>
    <p class="hint">會自動找出紙張範圍、裁掉多餘背景，再拉亮文字。第一版先以「拍得快、絕不漏張」為主。</p>
  </section>
  <div class="pages-head"><h2>這一批</h2><span>點右上角可刪單張</span></div><section id="grid" class="grid"><div class="empty-list">拍第一張後會顯示在這裡</div></section>
</main>
<footer class="export"><button id="zipBtn" class="btn" disabled>下載 JPG 壓縮檔</button><button id="pdfBtn" class="btn primary" disabled>下載 PDF</button></footer>
<div id="toast" class="toast"></div><div id="busy" class="busy"><div><div class="spinner"></div><strong id="busyText">處理中…</strong></div></div>
<script>
const $=s=>document.querySelector(s), pages=[]; let mode='scan', pickerMode='camera';
const camera=$('#camera'), viewer=$('#viewer'), preview=$('#preview'), grid=$('#grid'), busy=$('#busy'), busyText=$('#busyText');
$('#shoot').onclick=()=>{pickerMode='camera';camera.removeAttribute('multiple');camera.setAttribute('capture','environment');camera.click()};
$('#importBtn').onclick=()=>{pickerMode='album';camera.setAttribute('multiple','');camera.removeAttribute('capture');camera.click()};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;toast('之後拍的照片會套用「'+b.textContent+'」')});
camera.onchange=async()=>{const files=[...camera.files];camera.value='';if(!files.length)return;showBusy('處理 '+files.length+' 張…');for(let i=0;i<files.length;i++){busyText.textContent=`處理第 ${i+1}／${files.length} 張…`;try{pages.push(await processImage(files[i],mode));render()}catch(e){toast('有一張讀取失敗，沒有加入')}}hideBusy();toast(`已加入 ${files.length} 張`);if(pickerMode==='camera')setTimeout(()=>$('#shoot').focus(),50)};
async function processImage(file,fx){const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});const max=1800, scale=Math.min(1,max/Math.max(bmp.width,bmp.height));let w=Math.round(bmp.width*scale),h=Math.round(bmp.height*scale);const raw=document.createElement('canvas');raw.width=w;raw.height=h;const r=raw.getContext('2d',{willReadFrequently:true});r.drawImage(bmp,0,0,w,h);bmp.close();const box=findPaper(r,w,h);const pad=.015;let x=Math.max(0,Math.floor(box.x-w*pad)),y=Math.max(0,Math.floor(box.y-h*pad)),cw=Math.min(w-x,Math.ceil(box.w+w*pad*2)),ch=Math.min(h-y,Math.ceil(box.h+h*pad*2));const out=document.createElement('canvas');out.width=cw;out.height=ch;const c=out.getContext('2d',{willReadFrequently:true});c.drawImage(raw,x,y,cw,ch,0,0,cw,ch);if(fx!=='color')enhance(c,cw,ch,fx);const blob=await new Promise(res=>out.toBlob(res,'image/jpeg',.9));return{blob,url:URL.createObjectURL(blob),w:cw,h:ch,fx}}
function findPaper(ctx,w,h){const S=120,sw=Math.round(w/Math.max(w,h)*S),sh=Math.round(h/Math.max(w,h)*S),c=document.createElement('canvas');c.width=sw;c.height=sh;c.getContext('2d').drawImage(ctx.canvas,0,0,sw,sh);const d=c.getContext('2d').getImageData(0,0,sw,sh).data;let border=[];for(let x=0;x<sw;x++){for(const y of [0,sh-1]){let i=(y*sw+x)*4;border.push((d[i]+d[i+1]+d[i+2])/3)}}for(let y=1;y<sh-1;y++){for(const x of [0,sw-1]){let i=(y*sw+x)*4;border.push((d[i]+d[i+1]+d[i+2])/3)}}border.sort((a,b)=>a-b);const bg=border[Math.floor(border.length/2)],threshold=Math.max(24,Math.min(70,Math.abs(bg-128)*.32+28));let minX=sw,minY=sh,maxX=0,maxY=0,n=0;for(let y=2;y<sh-2;y++)for(let x=2;x<sw-2;x++){let i=(y*sw+x)*4,v=(d[i]+d[i+1]+d[i+2])/3;if(Math.abs(v-bg)>threshold){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);n++}}if(n<sw*sh*.12||maxX-minX<sw*.45||maxY-minY<sh*.45)return{x:0,y:0,w,h};const sx=w/sw,sy=h/sh;return{x:minX*sx,y:minY*sy,w:(maxX-minX+1)*sx,h:(maxY-minY+1)*sy}}
function enhance(ctx,w,h,fx){const img=ctx.getImageData(0,0,w,h),d=img.data;let sum=0;for(let i=0;i<d.length;i+=16)sum+=(d[i]+d[i+1]+d[i+2])/3;const avg=sum/(d.length/16),gain=Math.max(.92,Math.min(1.3,145/avg));for(let i=0;i<d.length;i+=4){let r=d[i]*gain,g=d[i+1]*gain,b=d[i+2]*gain;if(fx==='bw'){const y=.299*r+.587*g+.114*b,v=y>172?255:y<105?0:(y-105)*3.8;d[i]=d[i+1]=d[i+2]=v}else{d[i]=clamp((r-128)*1.22+145);d[i+1]=clamp((g-128)*1.22+145);d[i+2]=clamp((b-128)*1.22+145)}}ctx.putImageData(img,0,0)}const clamp=v=>Math.max(0,Math.min(255,v));
function render(){const n=pages.length;$('#counter').textContent=n+' 張';viewer.className='viewer '+(n?'has':'empty');if(n)preview.src=pages[n-1].url;grid.innerHTML=n?'':'<div class="empty-list">拍第一張後會顯示在這裡</div>';pages.forEach((p,i)=>{const el=document.createElement('div');el.className='thumb';el.innerHTML=`<img src="${p.url}" alt="第 ${i+1} 張"><span>${i+1}</span><button aria-label="刪除第 ${i+1} 張">×</button>`;el.querySelector('button').onclick=()=>remove(i);grid.appendChild(el)});['undoBtn','clearBtn','zipBtn','pdfBtn'].forEach(id=>$('#'+id).disabled=!n)}
function remove(i){URL.revokeObjectURL(pages[i].url);pages.splice(i,1);render();toast('已刪除 1 張')}
$('#undoBtn').onclick=()=>{if(pages.length)remove(pages.length-1)};$('#clearBtn').onclick=()=>{if(!pages.length||!confirm(`確定清空這 ${pages.length} 張？尚未下載的內容會消失。`))return;pages.forEach(p=>URL.revokeObjectURL(p.url));pages.length=0;render();toast('已清空')};
$('#zipBtn').onclick=async()=>{showBusy('製作 JPG 壓縮檔…');const files=[];for(let i=0;i<pages.length;i++)files.push({name:`紅單_${String(i+1).padStart(3,'0')}.jpg`,data:new Uint8Array(await pages[i].blob.arrayBuffer())});download(new Blob([makeZip(files)],{type:'application/zip'}),fileName('紅單','zip'));hideBusy()};
$('#pdfBtn').onclick=async()=>{showBusy('製作 PDF…');const items=[];for(const p of pages)items.push({data:new Uint8Array(await p.blob.arrayBuffer()),w:p.w,h:p.h});download(new Blob([makePdf(items)],{type:'application/pdf'}),fileName('紅單','pdf'));hideBusy()};
function fileName(base,ext){const d=new Date(),z=n=>String(n).padStart(2,'0');return`${base}_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${pages.length}張.${ext}`}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000);toast('下載完成，記得確認檔案頁數')}
function makePdf(imgs){const enc=new TextEncoder(),parts=[],offs=[0];let pos=0;const add=x=>{let u=typeof x==='string'?enc.encode(x):x;parts.push(u);pos+=u.length};add('%PDF-1.4\n');const count=2+imgs.length*3;function obj(n,body){offs[n]=pos;add(`${n} 0 obj\n`);add(body);add('\nendobj\n')}obj(1,'<< /Type /Catalog /Pages 2 0 R >>');const kids=imgs.map((_,i)=>`${3+i*3} 0 R`).join(' ');obj(2,`<< /Type /Pages /Kids [${kids}] /Count ${imgs.length} >>`);imgs.forEach((im,i)=>{const p=3+i*3,x=p+1,c=p+2,land=im.w>im.h,W=land?842:595,H=land?595:842,sc=Math.min(W/im.w,H/im.h),dw=im.w*sc,dh=im.h*sc,dx=(W-dw)/2,dy=(H-dh)/2;obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${x} 0 R >> >> /Contents ${c} 0 R >>`);offs[x]=pos;add(`${x} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.data.length} >>\nstream\n`);add(im.data);add('\nendstream\nendobj\n');const cmd=`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${dx.toFixed(2)} ${dy.toFixed(2)} cm /Im${i} Do Q`;obj(c,`<< /Length ${cmd.length} >>\nstream\n${cmd}\nendstream`) });const start=pos;add(`xref\n0 ${count+1}\n0000000000 65535 f \n`);for(let i=1;i<=count;i++)add(String(offs[i]).padStart(10,'0')+' 00000 n \n');add(`trailer\n<< /Size ${count+1} /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`);return new Blob(parts)}
function crc32(u){let c=-1;for(const b of u){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^-1)>>>0}function le(n,l){const u=new Uint8Array(l);for(let i=0;i<l;i++)u[i]=(n>>>(8*i))&255;return u}function makeZip(files){const e=new TextEncoder(),out=[],central=[];let off=0;for(const f of files){const n=e.encode(f.name),crc=crc32(f.data),head=new Uint8Array([...le(0x04034b50,4),...le(20,2),...le(0x800,2),...le(0,2),...le(0,2),...le(0,2),...le(crc,4),...le(f.data.length,4),...le(f.data.length,4),...le(n.length,2),...le(0,2),...n]);out.push(head,f.data);central.push(new Uint8Array([...le(0x02014b50,4),...le(20,2),...le(20,2),...le(0x800,2),...le(0,2),...le(0,2),...le(0,2),...le(crc,4),...le(f.data.length,4),...le(f.data.length,4),...le(n.length,2),...le(0,2),...le(0,2),...le(0,2),...le(0,2),...le(0,4),...le(off,4),...n]));off+=head.length+f.data.length}const cs=central.reduce((a,b)=>a+b.length,0);return new Blob([...out,...central,new Uint8Array([...le(0x06054b50,4),...le(0,2),...le(0,2),...le(files.length,2),...le(files.length,2),...le(cs,4),...le(off,4),...le(0,2)])])}
let tt;function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}function showBusy(s){busyText.textContent=s;busy.classList.add('show')}function hideBusy(){busy.classList.remove('show')}
render();
</script>
</body></html>
