<html lang="zh-Hant">

  <title>紅單掃描器</title>
  <meta name="description" content="不漏張、不上傳的本機紅單掃描工具">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e84b58'/%3E%3Cpath d='M18 12h22l8 8v32H18z' fill='white'/%3E%3Cpath d='M40 12v10h8M24 31h18M24 39h18M24 47h12' fill='none' stroke='%23e84b58' stroke-width='4'/%3E%3C/svg%3E">

    .app{max-width:720px;margin:auto;padding:16px 16px 120px}.top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 16px}.title{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-weight:900}.title h1{font-size:1.25rem;margin:0}.privacy{font-size:.8rem;color:var(--muted)}

    .camera-controls{display:flex;align-items:center;justify-content:center;gap:18px;min-height:108px}.capture{width:76px;height:76px;border-radius:50%;border:6px solid #fff;background:var(--accent);box-shadow:0 0 0 3px #ffffff22;flex:none}.capture:active{transform:scale(.94)}.done-camera{display:none;min-width:108px}.camera-running .done-camera{display:block}.camera-caption{text-align:center;color:var(--muted);font-size:.86rem;margin:-8px 0 14px}.camera-running .camera-caption{color:var(--ok)}#camera{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
    .toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn{border:1px solid var(--line);color:var(--text);background:var(--panel);padding:12px 8px;border-radius:14px;font-weight:650}.btn:disabled{opacity:.38;cursor:not-allowed}.btn.danger{color:#ff9aa1}.btn.primary{background:var(--accent);border-color:var(--accent)}
    .settings{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.seg{display:flex;background:#101116;border-radius:12px;padding:3px}.seg button{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:9px}.seg button.active{background:var(--panel2);color:white}.hint{font-size:.8rem;color:var(--muted);margin:10px 0 0;line-height:1.5}
    .auto-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.auto-copy strong{display:block}.auto-copy span{display:block;color:var(--muted);font-size:.82rem;margin-top:3px}.toggle{min-width:58px;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#101116;color:var(--muted);font-weight:750}.toggle.active{border-color:#67d69a66;background:#193c2b;color:#8bf0b6}
    .effect-settings{margin:0 0 10px;padding:9px 12px}.secondary-settings .auto-row{margin-top:0;padding-top:0;border-top:0}.viewer{aspect-ratio:4/3}.shooting .app{padding-top:8px;padding-bottom:20px}.shooting .viewer{width:min(100%,78dvh);margin-inline:auto}.shooting .export{display:none}.shooting .camera-controls{min-height:90px}.shooting .capture{width:68px;height:68px}.shooting .hint{display:none}

    @media(min-width:600px){.grid{grid-template-columns:repeat(5,1fr)}}@media(orientation:landscape){.viewer{aspect-ratio:4/3}}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div class="title"><div class="logo">單</div><h1>紅單掃描器</h1></div><div class="privacy">只在這台裝置處理</div></header>
  <section class="settings effect-settings"><div class="settings-row"><strong>影像效果</strong><div class="seg" role="group" aria-label="影像效果"><button data-mode="color">原色</button><button class="active" data-mode="scan">掃描</button><button data-mode="bw">黑白</button></div></div></section>
  <section id="viewer" class="viewer empty"><video id="live" autoplay playsinline muted></video><img id="preview" alt="最新掃描頁"><div id="scanGuide" class="scan-guide"><span>找不到紙邊時依此框裁切</span></div><canvas id="detectOverlay" class="detect-overlay"></canvas><div id="counter" class="count">0 張</div><div class="badge">不會自動刪頁</div></section>
  <input id="camera" type="file" accept="image/*" capture="environment" multiple>
  <div id="cameraControls" class="camera-controls"><button id="shoot" class="capture" aria-label="開啟連拍鏡頭或拍攝紅單"></button><button id="doneCamera" class="btn done-camera">完成拍攝</button></div>
  <div id="cameraCaption" class="camera-caption">按快門開啟鏡頭，之後可以連續拍攝</div>
  <div class="toolbar">
    <button id="importBtn" class="btn">從相簿加入</button>
    <button id="undoBtn" class="btn" disabled>復原上一張</button>
    <button id="clearBtn" class="btn danger" disabled>清空這批</button>
  </div>
  <section class="settings secondary-settings">
    <div class="settings-row auto-row"><div class="auto-copy"><strong>自動拍照</strong><span>綠框穩定約 1 秒後拍攝</span></div><button id="autoCapture" class="toggle active" role="switch" aria-checked="true">已開</button></div>
    <p class="hint">偵測到紙張時會顯示綠色外框並自動拉正；找不到才依黃色虛線框裁切。影像效果只套用在接下來拍攝的照片。</p>
  </section>
  <div class="pages-head"><h2>這一批</h2><span>點右上角可刪單張</span></div><section id="grid" class="grid"><div class="empty-list">拍第一張後會顯示在這裡</div></section>
</main>
<footer class="export"><button id="zipBtn" class="btn" disabled>下載 JPG 壓縮檔</button><button id="pdfBtn" class="btn primary" disabled>下載 PDF</button></footer>
<div id="toast" class="toast"></div><div id="busy" class="busy"><div><div class="spinner"></div><strong id="busyText">處理中…</strong></div></div>
<script>
const $=s=>document.querySelector(s), pages=[]; let mode='scan', pickerMode='camera', liveStream=null, captureQueue=Promise.resolve(), pendingCaptures=0, detectTimer=null, stableFrames=0, previousQuad=null, lastDetectedQuad=null, lastShotQuad=null, autoArmed=true, captureInProgress=false;
const camera=$('#camera'), viewer=$('#viewer'), preview=$('#preview'), live=$('#live'), guide=$('#scanGuide'), overlay=$('#detectOverlay'), grid=$('#grid'), busy=$('#busy'), busyText=$('#busyText'), controls=$('#cameraControls'), cameraCaption=$('#cameraCaption'), autoCapture=$('#autoCapture');live.className='fx-scan';
$('#shoot').onclick=()=>liveStream?captureLive(false):startLiveCamera();
$('#doneCamera').onclick=stopLiveCamera;
autoCapture.onclick=()=>{const on=!autoCapture.classList.contains('active');autoCapture.classList.toggle('active',on);autoCapture.setAttribute('aria-checked',String(on));autoCapture.textContent=on?'已開':'已關';resetAutoCapture();toast(on?'自動拍照已開啟':'自動拍照已關閉');if(liveStream)cameraCaption.textContent=on?'對準紙張，綠框穩定後會自動拍':'自動拍照已關閉，可按快門拍攝'};
$('#importBtn').onclick=()=>{pickerMode='album';camera.setAttribute('multiple','');camera.removeAttribute('capture');camera.click()};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;live.className='fx-'+mode;toast('鏡頭預覽與之後拍攝：'+b.textContent)});
camera.onchange=async()=>{const files=[...camera.files];camera.value='';if(!files.length)return;showBusy('處理 '+files.length+' 張…');for(let i=0;i<files.length;i++){busyText.textContent=`處理第 ${i+1}／${files.length} 張…`;try{pages.push(await processImage(files[i],mode));render()}catch(e){toast('有一張讀取失敗，沒有加入')}}hideBusy();toast(`已加入 ${files.length} 張`);if(pickerMode==='camera')setTimeout(()=>$('#shoot').focus(),50)};

    liveStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},aspectRatio:{ideal:1.333333},width:{ideal:1920},height:{ideal:1440}},audio:false});

}
function captureVisibleFrame(maxWidth=0){
  const vr=viewer.getBoundingClientRect(),vw=live.videoWidth,vh=live.videoHeight,scale=Math.max(vr.width/vw,vr.height/vh),sw=vr.width/scale,sh=vr.height/scale,sx=(vw-sw)/2,sy=(vh-sh)/2,outW=maxWidth?Math.min(maxWidth,Math.round(sw)):Math.round(sw),outH=Math.round(outW*vr.height/vr.width),c=document.createElement('canvas');c.width=outW;c.height=outH;c.getContext('2d').drawImage(live,sx,sy,sw,sh,0,0,outW,outH);return c

function resetAutoCapture(){stableFrames=0;previousQuad=null;lastDetectedQuad=null;lastShotQuad=null;autoArmed=true;captureInProgress=false}
function quadShift(a,b,diag){if(!a||!b)return Infinity;return a.reduce((n,p,i)=>n+dist(p,b[i]),0)/(4*diag)}
function startDetection(){stopDetection();resetAutoCapture();const tick=()=>{if(!liveStream)return;const frame=captureVisibleFrame(320),quad=detectPaperQuad(frame),ctx=overlay.getContext('2d'),diag=Math.hypot(frame.width,frame.height),auto=autoCapture.classList.contains('active');lastDetectedQuad=quad;overlay.width=frame.width;overlay.height=frame.height;ctx.clearRect(0,0,overlay.width,overlay.height);viewer.classList.toggle('paper-found',!!quad);if(quad){ctx.strokeStyle='#73f0a8';ctx.lineWidth=3;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(quad[0].x,quad[0].y);for(let i=1;i<4;i++)ctx.lineTo(quad[i].x,quad[i].y);ctx.closePath();ctx.stroke();if(auto){if(!autoArmed&&lastShotQuad&&quadShift(quad,lastShotQuad,diag)>.11){autoArmed=true;stableFrames=0;previousQuad=null}if(autoArmed){stableFrames=previousQuad&&quadShift(quad,previousQuad,diag)<.018?stableFrames+1:1;previousQuad=quad.map(p=>({...p}));const remaining=Math.max(0,3-stableFrames);cameraCaption.textContent=remaining?`保持不動，${remaining}…`:'正在自動拍照…';if(stableFrames>=3&&!captureInProgress){autoArmed=false;lastShotQuad=quad.map(p=>({...p}));captureLive(true)}}else cameraCaption.textContent=`已拍 ${pages.length+pendingCaptures} 張｜請換下一張`}else cameraCaption.textContent=`已找到紙邊｜按快門拍攝`}else{stableFrames=0;previousQuad=null;lastDetectedQuad=null;if(!autoArmed)autoArmed=true;cameraCaption.textContent=`把橫式單據放在黃色框附近｜已拍 ${pages.length+pendingCaptures} 張`}detectTimer=setTimeout(tick,420)};tick()}

  stopDetection();if(liveStream)liveStream.getTracks().forEach(t=>t.stop());liveStream=null;live.srcObject=null;document.body.classList.remove('shooting');viewer.classList.remove('live','flash','paper-found');controls.classList.remove('camera-running');cameraCaption.textContent=pendingCaptures?'照片仍在背景處理，完成後會出現在下方':'按快門可再開啟連拍鏡頭';render();toast(`這批目前 ${pages.length+pendingCaptures} 張`);

async function processImage(file,fx,guideFallback=false){const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});const max=1800,scale=Math.min(1,max/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*scale),h=Math.round(bmp.height*scale),raw=document.createElement('canvas');raw.width=w;raw.height=h;const r=raw.getContext('2d',{willReadFrequently:true});r.drawImage(bmp,0,0,w,h);bmp.close();const quad=detectPaperQuad(raw);let out;if(quad)out=warpPaper(raw,quad);else{const box=safeFallbackBox(w,h,guideFallback),x=Math.max(0,Math.round(box.x)),y=Math.max(0,Math.round(box.y)),cw=Math.min(w-x,Math.round(box.w)),ch=Math.min(h-y,Math.round(box.h));out=document.createElement('canvas');out.width=cw;out.height=ch;out.getContext('2d').drawImage(raw,x,y,cw,ch,0,0,cw,ch)}const c=out.getContext('2d',{willReadFrequently:true});if(fx!=='color')enhance(c,out.width,out.height,fx);const blob=await new Promise(res=>out.toBlob(res,'image/jpeg',.94));return{blob,url:URL.createObjectURL(blob),w:out.width,h:out.height,fx,detected:!!quad}}
